name: CI & Automated Testing Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test and Build Micro Frontends
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test & Build Auth App
        run: |
          echo "Starting testing for Auth App..."
          cd auth-app
          npm install
          npm run build
          echo "Auth App build completed successfully."

      - name: Test & Build Remote App
        run: |
          echo "Starting testing for Remote App..."
          cd remote-app
          npm install
          npm run build
          echo "Remote App build completed successfully."

      - name: Test & Build Host App
        run: |
          echo "Starting testing for Host App..."
          cd host-app
          npm install
          npm run build
          echo "Host App build completed successfully."

      - name: Final Verification
        run: echo "All micro-frontend automated tests and builds passed successfully!"
